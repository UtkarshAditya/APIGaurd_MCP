openapi: 3.0.3
info:
  title: Open security override fixture
  version: 1.0.0
servers:
  - url: https://api.example.com
security:
  - bearerAuth: []
paths:
  /users/{id}:
    get:
      operationId: getUser
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            maxLength: 36
      responses:
        "200":
          description: The user
        "401":
          description: Unauthorized
    delete:
      operationId: deleteUser
      # Vulnerable: the empty list overrides the global bearerAuth requirement.
      security: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            maxLength: 36
      responses:
        "204":
          description: Deleted
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
