[project]
name = "apiguard-mcp"
version = "0.1.0"
description = "MCP server that audits REST APIs for OWASP API Security Top 10 (2023) issues."
readme = "README.md"
requires-python = ">=3.11"
# license: not chosen yet (see LICENSE and open question Q5 in the architecture doc).
dependencies = [
    "mcp>=2,<3",  # 2.x renamed FastMCP to MCPServer
    "pydantic>=2",
    "httpx",
    "prance",
    "openapi-spec-validator",
    "ruamel.yaml",
]

[project.scripts]
apiguard-mcp = "apiguard.server:main"

[dependency-groups]
dev = [
    "pytest",
    "pytest-cov",
    "ruff",
    "mypy",
    "pip-audit",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/apiguard"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S", "SIM", "RUF"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101"]

[tool.mypy]
python_version = "3.11"
files = ["src"]
strict = true
plugins = ["pydantic.mypy"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers --import-mode=importlib --cov=apiguard --cov-report=term-missing"
